schema: spec-driven

context: |
  Twinmate is in a research/design phase: it has no implementation or runtime
  technology decision. The confirmed goal is to let an external, owner-delegated
  AI agent publish clearly marked AI messages as the owner in an existing
  two-person Mattermost DM, without adding a third member. Attribution must
  remain visible on unmodified native mobile clients. Operations must never
  exceed the owner's Mattermost permissions. These are product outcomes, not
  chosen APIs, authentication schemes, or deployment architecture.
  Research first-party Mattermost capabilities and edition/version constraints
  before recommending custom code. Treat docs/superpowers/, docs/history/, and
  openspec/changes/archive/ as legacy reference material only.
  Current approved specs are intentionally empty until a new design is reviewed.

rules:
  proposal:
    - Link the product problem and the research evidence behind the choice.
    - State alternatives considered, non-goals, assumptions, and rollback.
    - Identify which decisions are approved and which remain open.
  specs:
    - Specify observable outcomes with MUST and GIVEN/WHEN/THEN scenarios.
    - Cover both authorized and denied access for messages and identities.
    - State native-mobile behavior, DM boundaries, and license/version assumptions.
    - Do not copy legacy specs into active specs without a new design review.
  design:
    - Explain component ownership and third-party plugin dependencies.
    - Describe authorization, identity, provenance, trust boundaries, and failure paths.
    - Cite evidence for API or plugin-extension assumptions.
  tasks:
    - Map each approved behavior to focused and cross-boundary verification.
    - Keep steps independently checkable and avoid premature implementation work.
