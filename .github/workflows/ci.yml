name: CI
on:
  push:
    branches: [main, feat/twinmate-mvp]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Test Go
        run: go test ./...
